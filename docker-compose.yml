services:
  db:
    image: postgres:16
    container_name: clothes-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: clothes_organizer
    ports:
      - "5432:5432"
    volumes:
      - clothes_pg_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clothes_organizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: node:22
    container_name: clothes-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:senha123@db:5432/clothes_organizer
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  clothes_pg_data:
